name: Reprocess Yazio corrections (LLM)

# One-shot reprocessor: re-runs llm_sanity on every active rule-based
# `yazio_correction`, swaps in any refined value, and patches the matching
# daily_features row. Manual trigger only.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "ISO date floor (default 2024-01-01)"
        default: "2024-01-01"
      dry_run:
        description: "If 'true', print verdicts without writing to Supabase"
        default: "false"
      only_rule_key:
        description: "Optional rule_key filter (e.g. alcohol_hard_cap)"
        default: ""

jobs:
  reprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/yazio/requirements.txt

      - name: Install deps
        run: pip install -r ingest/yazio/requirements.txt

      - name: Run reprocess
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YAZIO_EMAIL: ${{ secrets.YAZIO_EMAIL }}
          YAZIO_PASSWORD: ${{ secrets.YAZIO_PASSWORD }}
          SINCE: ${{ github.event.inputs.since }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ONLY_RULE_KEY: ${{ github.event.inputs.only_rule_key }}
        run: |
          args="--since ${SINCE:-2024-01-01}"
          if [ "$DRY_RUN" = "true" ]; then
            args="$args --dry-run"
          fi
          if [ -n "$ONLY_RULE_KEY" ]; then
            args="$args --only-rule-key $ONLY_RULE_KEY"
          fi
          echo "running: python ingest/yazio/reprocess_corrections.py $args"
          python ingest/yazio/reprocess_corrections.py $args

      - name: Trigger build_daily_features for full refresh
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YAZIO_EMAIL: ${{ secrets.YAZIO_EMAIL }}
          YAZIO_PASSWORD: ${{ secrets.YAZIO_PASSWORD }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          pip install -r ingest/features/requirements.txt
          python ingest/features/build_daily_features.py --since "${SINCE:-2024-01-01}"
