name: Ingest Withings

on:
  schedule:
    # Every 3 hours. Withings access_token TTL = 3h so we refresh on every
    # run too. Body Scan + BPM + Sleep Analyzer push measurements throughout
    # the day; we never want to be more than 3h behind.
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "If set, ignore incremental sync and pull the trailing N days."
        default: ""

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/withings/requirements.txt
      - name: Install ingest deps
        run: pip install -r ingest/withings/requirements.txt
      - name: Run ingest
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: python ingest/withings/ingest_withings.py
