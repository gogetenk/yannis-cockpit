name: Scan Yazio false-zero alcohol

# Retro scan: detect days where the user logged a beer/wine/spirit but the
# matched Yazio product carries 0 g/g alcohol. Each match becomes an
# `alcohol_false_zero` correction (LLM-estimated ethanol mass) in
# `yazio_correction`. Manual trigger only.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "ISO date floor (default 2024-01-01)"
        default: "2024-01-01"
      until:
        description: "ISO date ceiling (default = today)"
        default: ""
      dry_run:
        description: "If 'true', print verdicts without writing to Supabase"
        default: "false"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/yazio/requirements.txt

      - name: Install deps
        run: pip install -r ingest/yazio/requirements.txt

      - name: Run scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YAZIO_EMAIL: ${{ secrets.YAZIO_EMAIL }}
          YAZIO_PASSWORD: ${{ secrets.YAZIO_PASSWORD }}
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args="--since ${SINCE:-2024-01-01}"
          if [ -n "$UNTIL" ]; then
            args="$args --until $UNTIL"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args="$args --dry-run"
          fi
          echo "running: python ingest/yazio/scan_false_zero_alcohol.py $args"
          python ingest/yazio/scan_false_zero_alcohol.py $args

      - name: Trigger build_daily_features for full refresh
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YAZIO_EMAIL: ${{ secrets.YAZIO_EMAIL }}
          YAZIO_PASSWORD: ${{ secrets.YAZIO_PASSWORD }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          pip install -r ingest/features/requirements.txt
          python ingest/features/build_daily_features.py --since "${SINCE:-2024-01-01}"
