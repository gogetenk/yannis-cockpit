name: Backrun LLM micronutrient enrichment

# One-shot backrun for daily_features.{fat_sat_g, sodium_mg, sugar_g, fiber_g,
# alcohol_g} on days where Yazio's photo-AI logger only returned macros.
# Idempotent: by default skips dates whose *_source columns are already set.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "ISO date floor (default = today-730d)."
        default: ""
      until:
        description: "ISO date ceiling (default = today)."
        default: ""
      skip_existing:
        description: "Skip dates already enriched (true/false). Default true."
        default: "true"
      dry_run:
        description: "Estimate without writing to DB (true/false). Default false."
        default: "false"
      force:
        description: "Re-estimate even llm_estimate fields (never overrides yazio). Default false."
        default: "false"

jobs:
  backrun:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/features/requirements.txt
      - run: pip install -r ingest/features/requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
          SKIP_EXISTING: ${{ github.event.inputs.skip_existing }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          args=()
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ -n "$UNTIL" ]; then args+=(--until "$UNTIL"); fi
          if [ "$SKIP_EXISTING" = "false" ]; then args+=(--no-skip-existing); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python ingest/yazio/backrun_enrichment.py "${args[@]}"
