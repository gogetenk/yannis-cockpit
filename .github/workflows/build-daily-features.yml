name: Build daily features

# Recomputes daily_features from raw ingested tables. Runs:
#   - after every successful "Build cockpit snapshot"
#   - every 30 minutes as a safety net
#   - manually with optional --since override

on:
  workflow_run:
    workflows: ["Build cockpit snapshot"]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "ISO date floor (default = today-120d). Use 2017-01-01 for full backfill."
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/features/requirements.txt
      - run: pip install -r ingest/features/requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YAZIO_EMAIL: ${{ secrets.YAZIO_EMAIL }}
          YAZIO_PASSWORD: ${{ secrets.YAZIO_PASSWORD }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then
            python ingest/features/build_daily_features.py --since "$SINCE"
          else
            python ingest/features/build_daily_features.py
          fi
